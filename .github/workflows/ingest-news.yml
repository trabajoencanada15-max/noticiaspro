name: Ingesta automática de noticias

# El plan Hobby de Vercel solo permite cron diario. Este workflow llama al
# endpoint protegido cada 30 minutos como reemplazo gratuito — ver plan en
# C:\Users\A ESTRELLA\.claude\plans\master-prompt-streamed-matsumoto.md
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al endpoint de ingestión
        run: |
          status=$(curl -s -o response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.SITE_URL || 'https://www.noticiaspro.com' }}/api/cron/ingest-news")
          echo "HTTP status: $status"
          cat response.json
          if [ "$status" -ge 300 ]; then
            exit 1
          fi
